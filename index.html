<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SOS</title>
<script>
/* =====================================================
   이름 바꾸기: 따옴표 " " 안의 글자만 바꾸기
   (따옴표, 쉼표, 대괄호는 지우지 말 것)
   ===================================================== */
const CONFIG = {
  owner:   "도연",       // 폰 주인
  partner: "채연",       // 찾는 사람
  ownerFull:   "김도연",  // 메모에 쓰이는 폰 주인 성+이름
  partnerFull: "정채연",  // 메모에 쓰이는 찾는 사람 성+이름
  place:   "우리 놀이터", // 만나기로 한 장소
  older:   true,          // true = 찾는 사람이 언니 / false = 동갑
  friends: ["연정", "유정", "소혜"], // 단톡 친구 3명 (첫째: 뮤지컬 동아리, 둘째: 물리는 친구, 셋째: 도서관)
  groupName: "과 동기들",
  ttName: "에브리타임",  // 시간표 앱 이름 (원하는 이름으로 바꾸기)
  ttIcon: "icon",    // 시간표 앱 아이콘 파일 이름 (확장자 빼고). 파일이 없으면 기본 아이콘
  sound: true,       // 배경음·효과음 켜기 (false면 라디오 말고는 소리 없음)
  ambience: 0.2,     // 배경음 크기 (0 ~ 1)
  sfxVolume: 0.3     // 효과음 크기 (0 ~ 1)
};
/* ===================================================== */
</script>
<style>
:root{
  --g1:#1c1c1e; --g2:#2c2c2e; --g3:#3a3a3c; --sep:#38383a;
  --l2:#8e8e93; --l3:#636366;
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --yellow:#ffd60a; --orange:#ff9f0a;
  --sms:#34c759; --them:#26252a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.25px}
body{display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:393px;height:min(852px,96vh);border-radius:58px;padding:12px;background:linear-gradient(145deg,#4a4a4c,#1d1d1f 35%,#2c2c2e 70%,#48484a);box-shadow:0 0 0 1px #6a6a6c,0 40px 90px rgba(0,0,0,.85)}
#screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#000}
@media (max-width:500px){#phone{width:100vw;height:100dvh;border-radius:0;padding:0;background:#000;box-shadow:none}#screen{border-radius:0}}
svg{display:block}

/* 망가진 화면 */
.ov{position:absolute;inset:0;pointer-events:none}
#crack{z-index:150}
#grain{z-index:149;opacity:.05;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:grain .4s steps(2) infinite}
@keyframes grain{50%{transform:translateY(1px)}}
#deadpx{z-index:151}#deadpx i{position:absolute;width:3px;height:3px;background:#0f0}
#screen.glitch{animation:gl .35s steps(3)}
@keyframes gl{25%{transform:translate(-4px,1px);filter:hue-rotate(90deg) saturate(3)}50%{transform:translate(3px,-2px);clip-path:inset(20% 0 30% 0)}75%{transform:translate(-1px);filter:invert(.15)}100%{transform:none;filter:none;clip-path:none}}

/* 다이나믹 아일랜드 + 상태바 */
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:140;transition:all .45s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
#island.wide{width:230px}
#island.tall{width:350px;height:74px;border-radius:36px}
#island .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
#island.wide .lbl,#island.tall .lbl{opacity:1;transition-delay:.25s}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 42px;font-size:17px;font-weight:600;z-index:130;pointer-events:none;font-family:-apple-system,"SF Pro Text",sans-serif}
#status .r{display:flex;gap:6px;align-items:center}
#sigtxt{font-size:14px;font-weight:600}
.bars{display:flex;gap:1.5px;align-items:flex-end;height:11px}
.bars i{width:3px;background:rgba(255,255,255,.3);border-radius:1px;transition:background .3s}
.bars.full i{background:#fff}
.batt{display:flex;align-items:center}
.batt b{display:block;width:25px;height:12px;border:1.2px solid rgba(255,255,255,.4);border-radius:4px;padding:1.5px}
.batt b i{display:block;height:100%;width:12%;background:var(--red);border-radius:1.5px;transition:width .5s}
.batt em{width:1.5px;height:4px;background:rgba(255,255,255,.4);border-radius:0 1px 1px 0;margin-left:1px}

/* 화면 */
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.view.pop{animation:pop .34s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.view.push{animation:push .32s cubic-bezier(.2,.8,.3,1)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
.view.unpush{animation:unpush .32s cubic-bezier(.2,.8,.3,1)}
@keyframes unpush{from{transform:translateX(-25%);opacity:.6}to{transform:none;opacity:1}}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:rgba(255,255,255,.9);z-index:135;cursor:pointer}
.homebar{touch-action:none}
.homebar::before{content:"";position:absolute;inset:-16px -24px}

/* 앱 아이콘 */
.ic{width:68px;height:68px;border-radius:15.5px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.ic.sm{width:38px;height:38px;border-radius:9px}
.app span{font-size:12.5px!important}

/* 잠금화면 */
#lock{background:radial-gradient(ellipse 90% 55% at 75% 105%,#6b2017 0%,transparent 70%),radial-gradient(ellipse 70% 50% at 10% 0%,#22302c 0%,transparent 70%),linear-gradient(180deg,#0b0e0e,#160907);align-items:center;touch-action:none}
#lock .ldate{margin-top:70px;font-size:20px;font-weight:600;color:rgba(255,255,255,.82)}
#lock .lclock{font-size:100px;font-weight:600;line-height:1;letter-spacing:-3px;font-family:-apple-system,"SF Pro Display",sans-serif;color:rgba(255,255,255,.92)}
#lock .lsub{margin-top:8px;font-size:14px;font-weight:600;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:6px}
.notis{width:100%;padding:0 9px;margin-top:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:7px}
.noti{background:rgba(58,58,60,.6);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border-radius:22px;padding:12px 14px;display:flex;gap:11px;font-size:15px;line-height:1.3}
.noti .nb{flex:1;min-width:0}
.noti .nh{display:flex;justify-content:space-between;font-weight:600}
.noti .nh span{font-weight:400;font-size:13px;color:rgba(255,255,255,.5)}
.noti .nt{color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noti.crit{background:rgba(120,28,22,.62)}
.lbtns{width:100%;display:flex;justify-content:space-between;padding:0 46px;margin-bottom:20px}
.lbtns div{width:50px;height:50px;border-radius:50%;background:rgba(58,58,60,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.lbtns div.lit{background:#fff;color:#000}
.swipe.nudge{animation:nudge .5s ease}
@keyframes nudge{30%{transform:translateY(-14px)}60%{transform:translateY(2px)}}
.swipe{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:30px;animation:breathe 2.6s infinite}
@keyframes breathe{50%{opacity:.3}}
#torch{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(255,250,220,.16),transparent 60%);opacity:0;transition:opacity .3s;z-index:120}
#torch.on{opacity:1}

/* 홈 */
#home{background:radial-gradient(ellipse 100% 60% at 80% 110%,#5a1a12 0%,transparent 70%),radial-gradient(ellipse 80% 50% at 0% 0%,#1d2a27 0%,transparent 70%),#080909;overflow:hidden}
#homeIn{position:absolute;left:0;top:0;width:calc(100% / var(--k,1));height:calc(100% / var(--k,1));transform:scale(var(--k,1));transform-origin:0 0;display:flex;flex-direction:column;padding-top:max(62px, calc(56px / var(--k,1)))}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:6px 24px 0}
.wdg{aspect-ratio:1;border-radius:22px;padding:14px;display:flex;flex-direction:column;cursor:pointer;background:rgba(28,28,30,.85)}
.wdg .wt{font-size:12px;font-weight:600;color:var(--yellow);display:flex;gap:4px;align-items:center}
.wdg .wb{font-size:15px;font-weight:600;margin-top:7px;line-height:1.3}
.wdg .ws{font-size:12.5px;color:var(--l2);margin-top:auto;line-height:1.35}
.wdg.bat{align-items:center;justify-content:center;gap:8px}
.ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring div{width:64px;height:64px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center}
.wdg.bat span{font-size:21px;font-weight:700;color:var(--red)}
.wlbls{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:5px 24px 0;text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;padding:22px 12px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative}
.app span{font-size:12px;color:#fff;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.app:active .ic{filter:brightness(.65)}
.badge{position:absolute;top:-8px;right:calc(50% - 42px);background:var(--red);color:#fff;font-size:14px;font-weight:500;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 7px;z-index:2}
.app.dead .ic{filter:grayscale(.85) brightness(.5)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.spot{margin:auto auto 14px;padding:6px 14px;border-radius:16px;background:rgba(80,80,80,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:500;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:5px}
.dock{margin:0 10px calc(40px + env(safe-area-inset-bottom,0px));padding:14px 10px;border-radius:36px;background:rgba(90,90,90,.32);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:grid;grid-template-columns:repeat(4,1fr)}

/* 앱 공통 */
#app{background:#000}
.nav{height:100px;padding:54px 6px 0;display:flex;align-items:center;flex-shrink:0;position:relative;z-index:5}
.nav.bord{background:rgba(22,22,23,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.bord.sc{border-color:var(--sep)}
.back{color:var(--blue);font-size:17px;cursor:pointer;display:flex;align-items:center;gap:3px;padding:6px 6px;min-width:70px}
.back svg{width:12px;height:21px}
.nav .ttl{position:absolute;left:90px;right:90px;bottom:12px;text-align:center;font-size:17px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ttl.show{opacity:1}
.nav .act{margin-left:auto;color:var(--blue);font-size:17px;padding:6px 12px;cursor:pointer}
.yel .back,.yel .act{color:var(--yellow)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:34px}
.big{font-size:34px;font-weight:700;padding:0 16px 8px;letter-spacing:.3px}
.search{margin:0 16px 12px;height:36px;border-radius:10px;background:var(--g1);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--l2);font-size:17px}
.row{display:flex;gap:12px;padding-left:16px;cursor:pointer;align-items:center}
.row:active{background:var(--g1)}
.row .in{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 0;border-bottom:.5px solid var(--sep)}
.row:last-child .in{border-bottom:none}
.av{width:45px;height:45px;border-radius:50%;background:linear-gradient(180deg,#a5a5aa,#727277);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;flex-shrink:0;color:#fff}
.av svg{width:58%;height:58%}
.av.grp{background:none;position:relative}
.av.grp i{position:absolute;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#a5a5aa,#727277);font-style:normal;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid #000}
.mid{flex:1;min-width:0}
.nm{font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm small{font-weight:400;color:var(--l2);font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chev{color:var(--l3)}
.pv{color:var(--l2);font-size:15px;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.udot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin:0 -2px 0 -8px;flex-shrink:0}
.nodot{width:10px;margin:0 -2px 0 -8px;flex-shrink:0}
.group{margin:0 16px;background:var(--g1);border-radius:11px;overflow:hidden}
.gh{font-size:20px;font-weight:700;padding:20px 20px 8px;display:flex;align-items:center;gap:6px}
.empty{text-align:center;color:var(--l2);font-size:17px;padding:120px 20px}

/* 대화 */
.thead{height:122px;padding-top:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex-shrink:0;background:rgba(22,22,23,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);z-index:5}
.thead .back{position:absolute;left:6px;top:62px}
.thead .back b{background:var(--blue);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:1px 7px;margin-left:2px}
.thead .av{width:52px;height:52px;font-size:21px}
.thead .av.grp{width:60px;height:52px}
.thead .tn{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:3px}
.thead .tn svg{width:6px;height:10px;color:var(--l2)}
.chat{padding:6px 12px 16px;display:flex;flex-direction:column}
.day{align-self:center;font-size:12px;color:var(--l2);margin:16px 0 8px;font-weight:500;text-align:center}
.day b{color:#c7c7cc;font-weight:600}
.day .late{display:block;color:var(--orange);font-size:11px;margin-top:1px}
.msg{max-width:74%;padding:7px 13px;border-radius:19px;font-size:17px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;margin-top:2px}
.msg.them{align-self:flex-start;background:var(--them)}
.msg.me{align-self:flex-end;background:var(--sms)}
.msg.me.failed{opacity:.75}
.msg.blur{filter:blur(3px);opacity:.5}
.msg.new{animation:newmsg .5s both}
@keyframes newmsg{from{opacity:0;transform:translateY(12px) scale(.96)}}
.sender{font-size:12px;color:var(--l2);margin:8px 0 1px 44px}
.grow{display:flex;align-items:flex-end;gap:7px;align-self:flex-start;max-width:82%}
.grow .msg{max-width:100%}
.gav{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#a5a5aa,#727277);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gav.hid{visibility:hidden}
.imgb{width:210px;height:250px;border-radius:18px;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:80px;align-self:flex-start;filter:grayscale(.6) contrast(1.1) brightness(.85);position:relative;overflow:hidden}
.fail{align-self:flex-end;font-size:12px;color:var(--red);display:flex;align-items:center;gap:4px;margin:3px 2px 4px}
.fail::before{content:"!";width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.deliv{align-self:flex-end;font-size:12px;color:var(--l2);margin:3px 2px 4px;font-weight:500}
.sys{align-self:center;font-size:12px;color:var(--l2);margin:10px 0}
.composer{display:flex;gap:8px;padding:6px 10px 32px;align-items:center;background:#000;flex-shrink:0}
.composer .plus{width:34px;height:34px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;color:#c7c7cc;font-size:24px;font-weight:300}
.composer .fld{flex:1;display:flex;align-items:center;border:1px solid var(--g3);border-radius:19px;padding:0 3px 0 13px;height:37px}
.composer input{flex:1;background:none;border:none;color:#fff;font-size:17px;outline:none;min-width:0}
.composer input::placeholder{color:var(--l3)}
.composer button{width:29px;height:29px;border-radius:50%;border:none;background:var(--sms);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sysnote{text-align:center;font-size:12px;color:var(--l2);padding:6px 20px 2px;background:#000}

/* 메모 */
.notebody{padding:0 20px 40px;font-size:17px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
.notebody .nd{text-align:center;font-size:13px;color:var(--l2);margin-bottom:14px}
.notebody h1{font-size:28px;font-weight:700;margin-bottom:6px;white-space:normal}
.notebody .del{display:block;text-align:center;color:var(--l2);font-size:13px;margin:-6px 0 14px}

/* 사진 */
.seg{display:flex;background:var(--g2);border-radius:9px;padding:2px;margin:0 auto 10px;width:max-content}
.seg span{padding:5px 18px;font-size:13px;font-weight:500;border-radius:7px;color:#ddd;cursor:pointer}
.seg span.on{background:#636366;color:#fff}
.psec{padding:16px 16px 8px;font-size:22px;font-weight:700}
.psec small{display:block;font-size:13px;color:var(--l2);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;position:relative;overflow:hidden}
.ph.grim{filter:grayscale(.75) contrast(1.2) brightness(.8)}
.corrupt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,0,80,.35) 0 3px,transparent 3px 9px,rgba(0,255,200,.25) 9px 11px,transparent 11px 20px);mix-blend-mode:screen;animation:cor 1.4s steps(4) infinite}
@keyframes cor{50%{transform:translateY(7px)}}
.pcount{text-align:center;color:var(--l2);font-size:13px;padding:16px 0}
.viewer{position:absolute;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
.viewer.on{display:flex;animation:pop .28s}
.viewer .vtop{height:100px;padding:54px 6px 0;display:flex;align-items:center;justify-content:center;position:relative}
.viewer .vtop .back{position:absolute;left:6px}
.viewer .vtop div{text-align:center;font-size:15px;font-weight:600}
.viewer .vtop div small{display:block;font-size:12px;color:var(--l2);font-weight:400}
.viewer .art{flex:1;display:flex;align-items:center;justify-content:center;font-size:120px;position:relative;overflow:hidden}
.viewer .cap{padding:14px 20px 8px;font-size:15px;line-height:1.5;color:#ddd}
.viewer .vbar{display:flex;justify-content:space-around;padding:12px 0 36px;color:var(--blue)}

/* 재난문자 */
.alert{margin:0 12px 10px;padding:13px 14px;background:var(--g1);border-radius:20px}
.alert .ah{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--l2);font-weight:500}

const BASE = new Date(2026, 10, 30);
const dn = t => t==="D-DAY" ? 0 : parseInt(t.slice(1),10);
const dt = (n,wk) => { const x = new Date(BASE); x.setDate(x.getDate()+n); return `${x.getMonth()+1}월 ${x.getDate()}일`+(wk?` (${"일월화수목금토"[x.getDay()]})`:""); };
const fmtD = (str,wk) => String(str).replace(/D-DAY|D[+-]\d+/g, m=>dt(dn(m),wk));
const tmin = t => { const m = (t||"").match(/(오전|오후) (\d+):(\d+)/); if(!m) return 0; let h = +m[2] % 12; if(m[1]==="오후") h += 12; return h*60 + +m[3]; };
threads.forEach(th=>{ const L = [...th.msgs].reverse().find(m=>m.d); th.key = dn(L.d)*10000 + tmin(L.tm); });
threads.sort((a,b)=>b.key-a.key);
threads.forEach(th=>th.msgs.forEach(m=>{ if(m.d) m.d = fmtD(m.d,true); }));
[...memos, deletedMemo].forEach(m=>{ m.d = fmtD(m.d); m.b = fmtD(m.b); });
photos.forEach(p=>{ p.d = fmtD(p.d); });
alerts.forEach(a=>{ a.tm = fmtD(a.tm); });
calls.forEach(c=>{ c.tm = fmtD(c.tm); });
news.forEach(n=>{ const x = new Date(BASE); x.setDate(x.getDate()+dn(n.d)); n.full = `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,"0")}.${String(x.getDate()).padStart(2,"0")} ${n.tm}`; n.d = fmtD(n.d); });

    L.style.transform = "translateY(-100%)"; L.style.opacity = 0;
    setTimeout(()=>{ unlock(); L.style.transition = "none"; L.style.transform = ""; L.style.opacity = ""; }, 260);

    if(Math.abs(dy) < 8){ const h = $(".swipe"); h.classList.remove("nudge"); void h.offsetWidth; h.classList.add("nudge"); }

};

function bubbles(th, newFrom=-1){
  let h = "", prev = null;
  th.msgs.forEach((m,i)=>{
    const nw = i>=newFrom && newFrom>=0 ? "new" : "";
    if(m.d){ h+=`<div class="day ${nw}"><b>${m.d}</b> ${m.tm||""}</div>`; prev=null; return; }
    if(m.img){ h+=`<div class="imgb ${nw}" style="background:${m.img.bg}">${m.img.e}${photoImg(m.img.f)}</div>`; prev=null; return; }
    const who = m.f? "me":"them";
    const bub = `<div class="msg ${who} ${m.fail?"failed":""} ${m.blur?"blur":""} ${nw}">${m.t}</div>`;
    if(th.group && !m.f){
      const nx = th.msgs[i+1]; const lastRun = !nx || nx.f || nx.d || nx.s!==m.s;
      if(prev!==m.s) h+=`<div class="sender">${N(m.s)}</div>`;
      h+=`<div class="grow"><span class="gav ${lastRun?"":"hid"}">${m.s[0]}</span>${bub}</div>`;
      prev = m.s;
    } else { h+=bub; prev=null; }
    if(m.fail) h+=`<div class="fail">전송되지 않음</div>`;
    else if(m.read) h+=`<div class="deliv">${m.read}</div>`;
  });
  return `<div class="chat">${h}</div>`;
}

/* 지도: 두 손가락으로 확대, 한 손가락으로 이동, 더블탭 확대, +/− 버튼 */
function mapZoom(cur){
  const svg = $("#mapsvg"), wrap = svg.parentElement;
  const W = 390, H = 860, MAXZ = 5;
  let vb = {x:0, y:0, w:W, h:H};
  const apply = () => {
    const minW = W/MAXZ; vb.w = Math.max(minW, Math.min(W, vb.w)); vb.h = vb.w*H/W;
    vb.x = Math.max(-40, Math.min(W+40-vb.w, vb.x)); vb.y = Math.max(-40, Math.min(H+40-vb.h, vb.y));
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  };
  const toMap = (cx, cy) => { const r = svg.getBoundingClientRect(); const k = vb.w / r.width; return [vb.x + (cx-r.left)*k, vb.y + (cy-r.top)*k]; };
  const zoomAt = (f, cx, cy) => { const [mx,my] = toMap(cx,cy); vb.x = mx - (mx-vb.x)/f; vb.y = my - (my-vb.y)/f; vb.w /= f; apply(); };
  const center = () => { const r = svg.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height*.4]; };
  const pts = new Map(); let lastD = 0, lastTap = 0;
  svg.style.touchAction = "none";
  svg.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]); svg.setPointerCapture(e.pointerId);
    if(pts.size === 1){ const now = Date.now(); if(now - lastTap < 300) zoomAt(1.8, e.clientX, e.clientY); lastTap = now; }
    if(pts.size === 2){ const [a,b] = [...pts.values()]; lastD = Math.hypot(a[0]-b[0], a[1]-b[1]); }
  });
  svg.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if(pts.size === 1){ const k = vb.w / svg.getBoundingClientRect().width; vb.x -= (e.clientX-prev[0])*k; vb.y -= (e.clientY-prev[1])*k; apply(); }
    else if(pts.size === 2){ const [a,b] = [...pts.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if(lastD) zoomAt(d/lastD, (a[0]+b[0])/2, (a[1]+b[1])/2); lastD = d; }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) lastD = 0; };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  $("#zin").onclick = () => { const [x,y] = center(); zoomAt(1.6, x, y); };
  $("#zout").onclick = () => { const [x,y] = center(); zoomAt(1/1.6, x, y); };
  $("#zme").onclick = () => { vb.w = W/2.6; apply(); vb.x = cur[0] - vb.w/2; vb.y = cur[1] - vb.h*.4; apply(); };
}

/* 아이폰 무음 모드에서도 들리게: 오디오 세션을 '재생'으로 바꾸고 무음 오디오를 하나 틀어둠 */
let unlockEl = null;
function silentWav(){
  const n = 8000, buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function ac(){
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
  if(!unlockEl){ unlockEl = new Audio(silentWav()); unlockEl.loop = true; unlockEl.setAttribute("playsinline",""); }
  unlockEl.play().catch(()=>{});
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state!=="running") actx.resume().catch(()=>{});
  return actx;
}
function startNoise(){
  try{
    const a = ac(); if(noiseSrc) return;
    const buf = a.createBuffer(1, a.sampleRate*2, a.sampleRate), d = buf.getChannelData(0);
    let last = 0; for(let i=0;i<d.length;i++){ const w = Math.random()*2-1; d[i] = (last + .5*w)/1.5; last = d[i]; if(Math.random()<.0004) d[i] *= 4; }
    noiseSrc = a.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
    const bp = a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200; bp.Q.value=.5;
    noiseGain = a.createGain(); noiseGain.gain.value = .12;
    noiseSrc.connect(bp).connect(noiseGain).connect(a.destination); noiseSrc.start();
    islandSet(`<span style="color:var(--red)">●</span><span>FM 라디오</span>`, "wide"); duck(true);
    const f = $("#fq"); if(f) tune(parseFloat(f.textContent));
  }catch(e){}
}
function stopRadio(keepUI){
  if(noiseSrc){ try{noiseSrc.stop()}catch(e){} noiseSrc = null; noiseGain = null; islandSet("",""); duck(false); }
  if(!keepUI){ clearInterval(typeTimer); lastSt = null; }
}
/* 주파수 맞으면: 작은 스피커로 지나가는 듯한 낡은 "띠링" + 지직 */
function chime(){
  if(!actx || !noiseSrc) return;
  const a = actx, t0 = a.currentTime + .05;
  const out = a.createGain(); out.gain.value = .9;
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 500;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400; lp.Q.value = 3;
  const sh = a.createWaveShaper(); const curve = new Float32Array(256);
  for(let i=0;i<256;i++){ const x = i/128-1; curve[i] = Math.tanh(x*3); } sh.curve = curve;
  out.connect(hp).connect(lp).connect(sh).connect(a.destination);
  [[659,0],[880,.16]].forEach(([f,dt])=>{
    const o = a.createOscillator(), g = a.createGain(), vib = a.createOscillator(), vg = a.createGain();
    o.type = "triangle"; o.frequency.value = f;
    vib.frequency.value = 7; vg.gain.value = 4; vib.connect(vg).connect(o.frequency);
    const t = t0 + dt;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t+.02);
    g.gain.setValueAtTime(.07, t+.12); g.gain.exponentialRampToValueAtTime(.0005, t+.7);
    o.connect(g).connect(out); o.start(t); vib.start(t); o.stop(t+.75); vib.stop(t+.75);
  });
  if(noiseGain){ noiseGain.gain.cancelScheduledValues(a.currentTime); noiseGain.gain.setValueAtTime(.16, a.currentTime); noiseGain.gain.setTargetAtTime(.02, a.currentTime+.25, .15); }
}
function tune(f){
  const fq = $("#fq"); if(!fq) return;
  fq.textContent = f.toFixed(1);
  let best = null, dist = 9;
  stations.forEach(s=>{ const dd = Math.abs(s.f-f); if(dd<dist){dist=dd;best=s;} });
  const strength = dist<.15?5: dist<.35?3: dist<.6?1:0;
  $$("#sig i").forEach((i,k)=>i.classList.toggle("on",k<strength));
  if(noiseGain) noiseGain.gain.setTargetAtTime(strength>=5? .02 : strength>=3? .07 : .12, actx.currentTime, .05);
  if(strength>=5 && best!==lastSt){ lastSt = best; chime(); typeLines(best); }
  else if(strength<5 && lastSt){ lastSt = null; clearInterval(typeTimer); $("#tr").textContent = strength? "…지직… 무언가 들리는 것 같다…" : "지지직……"; }
}
function typeLines(st){
  clearInterval(typeTimer);
  const full = st.lines.join("\n"); let i = 0; const tr = $("#tr");
  setTimeout(()=>{
    typeTimer = setInterval(()=>{ tr.innerHTML = `<div class="live">LIVE · ${st.name}</div>` + full.slice(0, ++i); if(i>=full.length) clearInterval(typeTimer); }, 60);
  }, 500);
}

/* ---------- 깨진 유리 (매번 같은 모양) ---------- */
(function buildCrack(){
  let seed = 7; const rnd = () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; };
  const cx = 318, cy = 182, W = 390, H = 844;
  const rays = [], N = 15;
  for(let i=0;i<N;i++){
    let ang = (i/N)*Math.PI*2 + (rnd()-.5)*.35, len = 160 + rnd()*620;
    let x = cx, y = cy, pts = [[x,y]], d = 0;
    while(d < len){
      const step = 10 + rnd()*28; ang += (rnd()-.5)*.38; d += step;
      x += Math.cos(ang)*step; y += Math.sin(ang)*step; pts.push([x,y]);
      if(x<-20||x>W+20||y<-20||y>H+20) break;
    }
    rays.push(pts);
  }
  const poly = pts => "M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  const at = (r,dist) => { let acc=0; for(let k=1;k<r.length;k++){ const [x0,y0]=r[k-1],[x1,y1]=r[k]; const seg=Math.hypot(x1-x0,y1-y0); if(acc+seg>=dist){ const t=(dist-acc)/seg; return [x0+(x1-x0)*t,y0+(y1-y0)*t]; } acc+=seg; } return null; };
  let shards = "", rings = "";
  [14, 30, 52, 85, 130].forEach((rad,ri)=>{
    for(let i=0;i<N;i++){
      if(rnd() < .25 + ri*.12) continue;
      const a = at(rays[i], rad*(.85+rnd()*.3)), b = at(rays[(i+1)%N], rad*(.85+rnd()*.3));
      if(!a||!b) continue;
      const mx = (a[0]+b[0])/2 + (rnd()-.5)*8, my = (a[1]+b[1])/2 + (rnd()-.5)*8;
      rings += `M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)} `;
      if(ri<3 && rnd()<.6){
        const a2 = at(rays[i], rad*.55), b2 = at(rays[(i+1)%N], rad*.55);
        if(a2&&b2) shards += `<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]} L${b2[0]} ${b2[1]} L${a2[0]} ${a2[1]}Z" fill="#fff" fill-opacity="${(.02+rnd()*.07).toFixed(3)}"/>`;
      }
    }
  });
  let branches = "";
  rays.forEach(r=>{ for(let k=3;k<r.length;k+=3+Math.floor(rnd()*3)){ if(rnd()<.55){ const [x,y]=r[k]; let ang=rnd()*Math.PI*2, bx=x, by=y, p=[[x,y]]; const n=2+Math.floor(rnd()*4); for(let j=0;j<n;j++){ ang+=(rnd()-.5)*.6; const st=8+rnd()*18; bx+=Math.cos(ang)*st; by+=Math.sin(ang)*st; p.push([bx,by]); } branches += poly(p)+" "; } } });
  const main = rays.map(poly).join(" ");
  $("#crackg").innerHTML = `
    <rect x="${cx-0.8}" y="${cy}" width="1.6" height="${H-cy}" fill="url(#lcdline)"/>
    <rect x="${cx+5}" y="${cy+30}" width="1" height="${H-cy-30}" fill="#ff3cf0" fill-opacity=".25"/>
    <circle cx="${cx}" cy="${cy}" r="70" fill="url(#bleed)"/>
    ${shards}
    <path d="${main}" stroke="#000" stroke-opacity=".55" stroke-width="2.2" fill="none" transform="translate(.7 .9)"/>
    <path d="${rings}" stroke="#000" stroke-opacity=".45" stroke-width="1.6" fill="none" transform="translate(.6 .8)"/>
    <path d="${branches}" stroke="#000" stroke-opacity=".35" stroke-width="1.2" fill="none" transform="translate(.5 .7)"/>
    <path d="${main}" stroke="#fff" stroke-opacity=".62" stroke-width=".9" fill="none"/>
    <path d="${rings}" stroke="#fff" stroke-opacity=".5" stroke-width=".7" fill="none"/>
    <path d="${branches}" stroke="#fff" stroke-opacity=".32" stroke-width=".5" fill="none"/>
    <path d="${main}" stroke="#cfe8ff" stroke-opacity=".18" stroke-width="3.5" fill="none" style="filter:blur(1.5px)"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#000" fill-opacity=".7"/><circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/>
    <path d="M${cx-4} ${cy-3} L${cx+3} ${cy-5} L${cx+5} ${cy+2} L${cx-1} ${cy+5}Z" fill="#fff" fill-opacity=".35"/>`;
})();

/* ---------- 사운드: 배경음(바람·먼 사이렌·헬기·금속음) + UI 효과음 ---------- */
const SND = { started:false, amb:null, sfx:null, base:0, vmSrc:null };
function noiseBuf(a, sec, brown){
  const b = a.createBuffer(1, a.sampleRate*sec, a.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for(let i=0;i<d.length;i++){ const w = Math.random()*2-1; if(brown){ last = (last + .02*w)/1.02; d[i] = last*3.5; } else d[i] = w; }
  return b;
}
function pan(a, v){ if(a.createStereoPanner){ const p = a.createStereoPanner(); p.pan.value = v; return p; } return a.createGain(); }
function sndInit(){
  if(!CONFIG.sound || SND.started) return;
  let a; try{ a = ac(); }catch(e){ return; }
  SND.started = true;
  SND.sfx = a.createGain(); SND.sfx.gain.value = Math.max(0, Math.min(1, CONFIG.sfxVolume ?? .3)); SND.sfx.connect(a.destination);
  SND.amb = a.createGain(); SND.amb.gain.value = 0; SND.amb.connect(a.destination);
  SND.base = Math.max(0, Math.min(1, CONFIG.ambience ?? .2));
  SND.amb.gain.setTargetAtTime(noiseSrc ? SND.base*.2 : SND.base, a.currentTime, 2);

  // 바람: 낮게 깔리는 브라운 노이즈가 천천히 숨 쉬듯 커졌다 작아짐
  const wind = a.createBufferSource(); wind.buffer = noiseBuf(a, 8, true); wind.loop = true;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = .8;
  const wg = a.createGain(); wg.gain.value = .55;
  const l1 = a.createOscillator(), l1g = a.createGain(); l1.frequency.value = .06; l1g.gain.value = 220; l1.connect(l1g).connect(lp.frequency);
  const l2 = a.createOscillator(), l2g = a.createGain(); l2.frequency.value = .09; l2g.gain.value = .25; l2.connect(l2g).connect(wg.gain);
  wind.connect(lp).connect(wg).connect(SND.amb); wind.start(); l1.start(); l2.start();

  // 아주 옅은 전기 웅웅거림 (깨진 화면)
  const hum = a.createOscillator(), hg = a.createGain(), hf = a.createBiquadFilter();
  hum.type = "sawtooth"; hum.frequency.value = 60; hf.type = "lowpass"; hf.frequency.value = 180; hg.gain.value = .012;
  hum.connect(hf).connect(hg).connect(SND.amb); hum.start();

  setTimeout(ambEvent, 6000 + Math.random()*6000);
}
function ambEvent(){
  if(!SND.started) return;
  const r = Math.random();
  if(r < .38) sndHeli(); else if(r < .68) sndSiren(); else if(r < .88) sndClang(); else sndGroan();
  setTimeout(ambEvent, 22000 + Math.random()*30000);
}
function distant(a, dest, wet=.35){
  const d = a.createDelay(1); d.delayTime.value = .21 + Math.random()*.1;
  const fb = a.createGain(); fb.gain.value = .38; const lp = a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 1400;
  const w = a.createGain(); w.gain.value = wet;
  d.connect(lp).connect(fb).connect(d); lp.connect(w).connect(dest);
  return d;
}
function sndSiren(){
  const a = actx, t = a.currentTime, dur = 9;
  const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter(), p = pan(a, Math.random()*1.4-.7);
  o.type = "sawtooth"; lp.type = "lowpass"; lp.frequency.value = 900;
  for(let k=0;k<5;k++){ o.frequency.setValueAtTime(620, t+k*1.9); o.frequency.linearRampToValueAtTime(940, t+k*1.9+.95); o.frequency.linearRampToValueAtTime(620, t+k*1.9+1.9); }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t+3); g.gain.linearRampToValueAtTime(0, t+dur);
  o.connect(lp).connect(g).connect(p).connect(SND.amb); g.connect(distant(a, SND.amb));
  o.start(t); o.stop(t+dur+.2);
}
function sndHeli(){
  const a = actx, t = a.currentTime, dur = 16;
  const n = a.createBufferSource(); n.buffer = noiseBuf(a, 2, false); n.loop = true;
  const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 110; bp.Q.value = 1.2;
  const chop = a.createGain(); chop.gain.value = .5;
  const lfo = a.createOscillator(), lg = a.createGain(); lfo.type = "square"; lfo.frequency.value = 11.5; lg.gain.value = .5; lfo.connect(lg).connect(chop.gain);
  const env = a.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(.9, t+6); env.gain.setValueAtTime(.9, t+9); env.gain.linearRampToValueAtTime(0, t+dur);
  const p = pan(a, -.8); if(p.pan) p.pan.linearRampToValueAtTime(.8, t+dur);
  n.connect(bp).connect(chop).connect(env).connect(p).connect(SND.amb);
  n.start(t); lfo.start(t); n.stop(t+dur+.1); lfo.stop(t+dur+.1);
}
function sndClang(){
  const a = actx, t = a.currentTime, p = pan(a, Math.random()*1.6-.8), g = a.createGain();
  g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0005, t+1.6);
  [317, 441, 662].forEach(f=>{ const o = a.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t+1.7); });
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200;
  g.connect(lp).connect(p).connect(SND.amb); lp.connect(distant(a, SND.amb, .5));
}
function sndGroan(){
  const a = actx, t = a.currentTime, dur = 2.2;
  const o = a.createOscillator(), vib = a.createOscillator(), vg = a.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(105, t); o.frequency.linearRampToValueAtTime(82, t+dur);
  vib.frequency.value = 5; vg.gain.value = 4; vib.connect(vg).connect(o.frequency);
  const f1 = a.createBiquadFilter(); f1.type = "bandpass"; f1.frequency.value = 520; f1.Q.value = 4;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t+.5); g.gain.linearRampToValueAtTime(0, t+dur);
  const p = pan(a, Math.random()<.5 ? -.9 : .9);
  o.connect(f1).connect(lp).connect(g).connect(p).connect(SND.amb); g.connect(distant(a, SND.amb, .45));
  o.start(t); vib.start(t); o.stop(t+dur+.1); vib.stop(t+dur+.1);
}
function duck(on){ if(SND.started) SND.amb.gain.setTargetAtTime(on ? SND.base*.2 : SND.base, actx.currentTime, .4); }

/* UI 효과음 */
function sfxTap(){
  // 살짝 둥근 "톡"
  if(!SND.started) return; const a = actx, t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(560, t);
  o.frequency.exponentialRampToValueAtTime(660, t+.03);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.26, t+.006); g.gain.exponentialRampToValueAtTime(.001, t+.09);
  o.connect(g).connect(SND.sfx); o.start(t); o.stop(t+.11);
}
function sfxWhoosh(){
  if(!SND.started) return; const a = actx, t = a.currentTime;
  const n = a.createBufferSource(); n.buffer = noiseBuf(a, .4, false);
  const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4; bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2600, t+.28);
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t+.08); g.gain.exponentialRampToValueAtTime(.001, t+.32);
  n.connect(bp).connect(g).connect(SND.sfx); n.start(t);
}
function sfxBonk(){
  if(!SND.started) return; const a = actx, t = a.currentTime;
  [[233,0],[175,.11]].forEach(([f,d])=>{ const o = a.createOscillator(), g = a.createGain(); o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(.22, t+d+.01); g.gain.exponentialRampToValueAtTime(.001, t+d+.2);
    o.connect(g).connect(SND.sfx); o.start(t+d); o.stop(t+d+.22); });
}
function sfxAlert(){
  if(!SND.started) return; const a = actx, t = a.currentTime;
  [[1046,0],[1318,.13]].forEach(([f,d])=>{ const o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(.12, t+d+.01); g.gain.exponentialRampToValueAtTime(.001, t+d+.35);
    o.connect(g).connect(SND.sfx); o.start(t+d); o.stop(t+d+.4); });
}
function sfxGlitch(){
  if(!SND.started) return; const a = actx, t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = "square"; o.frequency.setValueAtTime(70, t); o.frequency.setValueAtTime(140, t+.06); o.frequency.setValueAtTime(55, t+.12);
  const n = a.createBufferSource(); n.buffer = noiseBuf(a, .2, false); const ng = a.createGain(); ng.gain.value = .5;
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
  g.gain.setValueAtTime(.07, t); g.gain.setValueAtTime(0, t+.04); g.gain.setValueAtTime(.06, t+.07); g.gain.exponentialRampToValueAtTime(.001, t+.2);
  o.connect(g); n.connect(hp).connect(ng).connect(g); g.connect(SND.sfx);
  o.start(t); o.stop(t+.22); n.start(t);
}
function sfxVM(on){
  if(!SND.started) return;
  if(SND.vmSrc){ try{ SND.vmSrc.stop(); }catch(e){} SND.vmSrc = null; }
  if(!on) return;
  const a = actx, n = a.createBufferSource(); n.buffer = noiseBuf(a, 2, false); n.loop = true;
  const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = .8;
  const g = a.createGain(); g.gain.value = .05;
  n.connect(bp).connect(g).connect(SND.sfx); n.start(); SND.vmSrc = n;
}

// 첫 터치에 소리 시작 (브라우저가 자동 재생을 막아서)
document.addEventListener("pointerdown", sndInit, {capture:true});
// 버튼 누를 때 톡 소리
document.addEventListener("pointerdown", e => {
  if(!SND.started || e.target.closest("[data-dead]")) return;
  if(e.target.closest(".app,.back,.row,.etfr,.ettab div,.tabbar div,.seg span,.tttabs span,.ph,.lbtns div,.pb,.pbtn,#iosalert button,.mctl div,.etsem span,.homebar,.wdg")) sfxTap();
}, {capture:true});
document.addEventListener("visibilitychange", () => { if(!actx) return; document.hidden ? actx.suspend() : actx.resume(); });
</script>
</body>
